hydra:
  run:
    dir: ./outputs/${data.train}/${now:%Y.%m.%d}/${now:%H%M%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - mode=rec_eval
    - evaluator.candidate_multiplier=19
    - evaluator.topk=[10,20]
    - evaluator.allow_duplicate_items=true
    - training.layer_loss_weights.enabled=false
    - loader.batch_size=32
    - loader.eval_batch_size=32
    - data=movielens20m_len60
    - dataset=MovieLens-20M/len60
    - evaluator.dataset=MovieLens-20M/len60
    - model=small
    - model.hidden_size=64
    - parameterization=subs
    - backbone=dit
    - rq_n_codebooks=3
    - rq_codebook_size=256
    - model.length=302
    - seq_len=60
    - swap_ratio=0
    - sampling.cfg_enabled=true
    - sampling.cfg_encoder=true
    - sampling.cfg_w=2.0
    - eval.predict_num_items=30
    - eval.checkpoint_path=/home/sjj/wenhao/DISCO/outputs/movielens20m_len60/2026.04.25/231512/checkpoints/best.ckpt
  job:
    name: main
    chdir: true
    override_dirname: backbone=dit,data=movielens20m_len60,dataset=MovieLens-20M/len60,eval.checkpoint_path=/home/sjj/wenhao/DISCO/outputs/movielens20m_len60/2026.04.25/231512/checkpoints/best.ckpt,eval.predict_num_items=30,evaluator.allow_duplicate_items=true,evaluator.candidate_multiplier=19,evaluator.dataset=MovieLens-20M/len60,evaluator.topk=[10,20],loader.batch_size=32,loader.eval_batch_size=32,mode=rec_eval,model.hidden_size=64,model.length=302,model=small,parameterization=subs,rq_codebook_size=256,rq_n_codebooks=3,sampling.cfg_enabled=true,sampling.cfg_encoder=true,sampling.cfg_w=2.0,seq_len=60,swap_ratio=0,training.layer_loss_weights.enabled=false
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/sjj/wenhao
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/sjj/wenhao/DISCO/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/sjj/wenhao/outputs/movielens20m_len60/2026.05.04/170646
    choices:
      lr_scheduler: constant_warmup
      noise: loglinear
      strategy: ddp
      model: small
      data: movielens20m_len60
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
