mode: rec_eval
diffusion: absorbing_state
backbone: dit
parameterization: subs
time_conditioning: false
T: 0
subs_masking: false
seed: 1
loader:
  global_batch_size: 512
  eval_global_batch_size: ${.global_batch_size}
  batch_size: 32
  eval_batch_size: 1
  num_workers: ${eval:"len(__import__('os').sched_getaffinity(0))"}
  pin_memory: true
sampling:
  predictor: ddpm_cache
  steps: 256
  noise_removal: true
  num_sample_batches: 2
  num_sample_log: 2
  semi_ar: false
  stride_length: 1
  num_strides: 1
  cfg_enabled: true
  cfg_encoder: true
  cfg_p_drop: 0.1
  cfg_w: 2.0
training:
  ema: 0.9999
  antithetic_sampling: true
  importance_sampling: false
  sampling_eps: 0.001
  change_of_variables: false
  layer_loss_weights:
    enabled: false
    rvq_weights:
    - 2.0
    - 1.5
    - 1.0
    conflict_weight: 0.5
eval:
  checkpoint_path: /home/sjj/wenhao/DISCO/outputs/yelp/2026.03.31/121517/checkpoints/best.ckpt
  disable_ema: false
  compute_generative_perplexity: false
  perplexity_batch_size: 8
  compute_perplexity_on_sanity: false
  gen_ppl_eval_model_name_or_path: gpt2-large
  generate_samples: true
  predict_num_items: 3
  predict_ratio: null
optim:
  weight_decay: 0
  lr: 0.0003
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-08
trainer:
  _target_: lightning.Trainer
  accelerator: cuda
  num_nodes: 1
  devices: ${device_count:}
  accumulate_grad_batches: ${div_up:${loader.global_batch_size}, ${eval:${trainer.devices}
    * ${loader.batch_size} * ${trainer.num_nodes}}}
  gradient_clip_val: 1.0
  precision: bf16
  num_sanity_val_steps: 2
  max_steps: 20000
  log_every_n_steps: 10
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  val_check_interval: 32
wandb: null
use_tensorboard: true
checkpointing:
  save_dir: ${cwd:}
  resume_from_ckpt: true
  resume_ckpt_path: ${.save_dir}/checkpoints/last.ckpt
evaluator:
  dataset: Yelp
  feature_type: clhe
  sent_emb_pca: -1
  cir: 1
  topk:
  - 1
  - 2
  - 3
  metrics:
  - recall
  - precision
  - hit
  - hitf
  - sm
  sm_topk: 1
  candidate_multiplier: 19
  allow_duplicate_items: true
dataset: Yelp
feature_type: clhe
sent_emb_pca: -1
seq_len: 10
cir: 1
swap_ratio: 0
num_proc: 1
eval_batch_size: 32
train_batch_size: 64
rq_faiss: true
faiss_omp_num_threads: 32
rq_n_codebooks: 3
rq_codebook_size: 256
callbacks:
  checkpoint_every_n_steps:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val/nll
    mode: min
    save_top_k: 3
    save_last: true
    dirpath: ${checkpointing.save_dir}/checkpoints
    verbose: true
    auto_insert_metric_name: false
    every_n_train_steps: 500
  checkpoint_monitor:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val/nll
    mode: min
    save_top_k: 1
    save_last: false
    dirpath: ${checkpointing.save_dir}/checkpoints
    filename: best
    auto_insert_metric_name: false
    verbose: true
  learning_rate_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: step
data:
  train: yelp
  valid: yelp
  test: test.txt
  tokenizer_name_or_path: MDLMTokenizer
  cache_dir: /home/sjj/wenhao/DISCO/datasets/Yelp
  wrap: true
  streaming: false
model:
  name: small
  type: ddit
  hidden_size: 64
  cond_dim: 128
  length: 52
  n_blocks: 6
  n_heads: 8
  scale_by_sigma: true
  dropout: 0.1
  tie_word_embeddings: false
strategy:
  _target_: lightning.pytorch.strategies.DDPStrategy
  find_unused_parameters: false
noise:
  type: loglinear
  sigma_min: 0.0001
  sigma_max: 20
lr_scheduler:
  _target_: transformers.get_constant_schedule_with_warmup
  num_warmup_steps: 500
